<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Terrain — Auth · Stride T1-batch2</title>
<!--
  DIRECTION: SOFT TERRAIN — the arc as a walk up a hill. Warm paper, faint topographic
  contours (a fixed texture, NOT a per-phase color wash), a trail line with a cairn marker
  for progress. TOKEN RECONCILIATION: text/border/lavender tokens as-is.
  DELIBERATE EXTENSIONS (called out): warm paper ground #f7f4ee + contour line color;
  the cairn glyph (three stacked stones) is Stry REIMAGINED as a trail marker — static, tiny.
  Motion: trailhead card rises 20px + fades, 220ms; opacity-only under reduced motion.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#0d101b; --lav:#b3a0ff; --lav-soft:#ede8ff; --paper:#f7f4ee;
    --card:#fff; --line:#e9e4d8; --muted:#6a7081; --subtle:#9099ad;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .contours{position:fixed;inset:0;pointer-events:none;z-index:0}

  header{position:relative;z-index:1;max-width:520px;margin:0 auto;width:100%;padding:26px 24px 0;display:flex;justify-content:space-between;align-items:center}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.2px}
  .trailtag{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--subtle)}

  main{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .trailhead{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 28px;box-shadow:0 2px 10px rgba(13,16,27,.05);animation:rise .22s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  .marker{display:flex;align-items:center;gap:10px}
  .marker .lbl{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:14px;line-height:1.2}
  .sub{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.55}

  form{margin-top:24px;display:grid;gap:15px}
  label{display:grid;gap:6px}
  .lab{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
  input{background:#fbf9f4;border:1px solid var(--line);border-radius:9999px;padding:13px 18px;font:500 14.5px "Manrope",sans-serif;color:var(--ink);outline:none;transition:border-color .15s}
  input:focus{border-color:var(--lav)}
  input::placeholder{color:var(--subtle)}
  .submit{margin-top:4px;background:var(--ink);color:#fff;border:none;border-radius:9999px;padding:15px;font:800 14px "Manrope",sans-serif;cursor:pointer}
  .or{display:flex;align-items:center;gap:12px;color:var(--subtle);font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:2px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .google{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:9999px;padding:13px;font:700 13.5px "Manrope",sans-serif;color:var(--ink);cursor:pointer}
  .google:hover{border-color:var(--ink)}
  .switch{text-align:center;font-size:13px;color:var(--muted);margin-top:20px}
  .switch a{color:var(--ink);font-weight:800}
  /* In production: <div id="clerk-captcha"> sits in the sign-up variant; card height is flexible. */

  .proto-nav{position:fixed;right:14px;bottom:12px;font:600 11px/1 "Manrope",sans-serif;opacity:.45;z-index:2}
  .proto-nav a{color:var(--ink)}
  @media (prefers-reduced-motion: reduce){ .trailhead{animation:none} }
</style>
</head>
<body>
  <!-- Faint contour texture: constant across every screen; decorative only -->
  <svg class="contours" width="100%" height="100%" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#0d101b" stroke-opacity=".055" stroke-width="1.2">
      <path d="M-60 180 Q 200 60 420 170 T 900 140"/>
      <path d="M-60 240 Q 210 120 430 230 T 900 200"/>
      <path d="M-60 310 Q 220 190 440 300 T 900 270"/>
      <path d="M-60 560 Q 240 430 470 550 T 900 520"/>
      <path d="M-60 640 Q 250 510 480 630 T 900 600"/>
      <path d="M-60 720 Q 260 590 490 710 T 900 680"/>
      <ellipse cx="640" cy="330" rx="120" ry="60"/>
      <ellipse cx="640" cy="330" rx="200" ry="105"/>
      <ellipse cx="640" cy="330" rx="280" ry="150"/>
    </g>
  </svg>

  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><g fill="#0d101b"><rect x="5" y="13" width="10" height="4" rx="2"/><rect x="6.5" y="8.5" width="7" height="3.5" rx="1.75"/><rect x="8" y="4.5" width="4" height="3" rx="1.5"/></g></svg>
      Stride
    </div>
    <span class="trailtag">Trailhead</span>
  </header>

  <main>
    <div class="trailhead">
      <div class="marker">
        <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><g fill="#b3a0ff"><rect x="5" y="13" width="10" height="4" rx="2"/><rect x="6.5" y="8.5" width="7" height="3.5" rx="1.75"/><rect x="8" y="4.5" width="4" height="3" rx="1.5"/></g></svg>
        <span class="lbl">Base camp · sign in</span>
      </div>
      <h1 tabindex="-1">Lace up. Your trail is waiting.</h1>
      <p class="sub">Sign in to rejoin your plan where you left it.</p>

      <form onsubmit="return false">
        <label><span class="lab">Email</span>
          <input type="email" placeholder="you@example.com" autocomplete="email">
        </label>
        <label><span class="lab">Password</span>
          <input type="password" placeholder="••••••••" autocomplete="current-password">
        </label>
        <button class="submit" type="submit">Sign in</button>
        <div class="or">or</div>
        <button class="google" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
      </form>
      <p class="switch">First hike? <a href="#">Start at the trailhead</a></p>
    </div>
  </main>
  <p class="proto-nav"><a href="../index.html">← all directions</a></p>
</body>
</html>

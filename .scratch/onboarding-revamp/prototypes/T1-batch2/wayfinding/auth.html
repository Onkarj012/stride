<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfinding — Auth · Stride T1-batch2</title>
<!--
  DIRECTION: WAYFINDING — the entry arc as transit signage. The route line (with named
  stations) is the shared chrome across auth → onboarding → reveal; the ink "sign panel"
  carries the headline. TOKEN RECONCILIATION: pure token palette (ink/lavender/surface/borders).
  DELIBERATE EXTENSIONS (called out): Archivo as the signage display face.
  Stry's role: voice-only — the PA announcer ("‣ PA:" lines). No mascot art anywhere.
  OAuth note: the Google button is the one path that leaves the terminal — production pairs it
  with a branded /sso-callback "transferring lines…" loader.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#0d101b; --lav:#b3a0ff; --bg:#f8f8f8; --card:#fff;
    --line:#ebebef; --line-strong:#d9d9e0; --muted:#6a7081; --subtle:#9099ad;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .term{max-width:640px;margin:0 auto;width:100%;padding:26px 24px 0}
  .route{display:flex;align-items:center;gap:0}
  .station{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
  .station .pip{width:10px;height:10px;border-radius:50%;border:2px solid var(--line-strong);background:var(--card)}
  .station.here .pip{border-color:var(--ink);background:var(--lav);box-shadow:0 0 0 3px #ede8ff}
  .station .name{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.5px;color:var(--subtle);text-transform:uppercase}
  .station.here .name{color:var(--ink);font-weight:700}
  .seg{flex:1;height:2px;background:var(--line-strong);margin:0 4px 16px}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 24px 40px}
  .stop{width:100%;max-width:440px;animation:arrive .18s var(--ease) both}
  @keyframes arrive{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

  .pa{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);margin-bottom:12px}
  .sign{background:var(--ink);color:#fff;border-radius:16px;padding:26px 26px 28px;box-shadow:0 8px 24px rgba(13,16,27,.12)}
  .gate{display:inline-block;background:var(--lav);color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:500;letter-spacing:1px;padding:5px 10px;border-radius:9999px;text-transform:uppercase}
  .sign h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:30px;letter-spacing:-.5px;line-height:1.1;margin-top:14px}
  .sign p{font-size:13.5px;color:rgba(255,255,255,.65);margin-top:8px;line-height:1.5}

  form{margin-top:22px;display:grid;gap:14px}
  label{display:grid;gap:6px}
  .lab{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1.5px;color:var(--subtle);text-transform:uppercase}
  input{background:var(--card);border:1px solid var(--line-strong);border-radius:12px;padding:13px 14px;font:500 14.5px "Manrope",sans-serif;color:var(--ink);outline:none;transition:border-color .15s}
  input:focus{border-color:var(--lav)}
  input::placeholder{color:var(--subtle)}
  .submit{margin-top:4px;background:var(--ink);color:#fff;border:none;border-radius:9999px;padding:15px;font:800 14px "Manrope",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .or{display:flex;align-items:center;gap:12px;color:var(--subtle);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:2px;margin:2px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .google{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--line-strong);border-radius:9999px;padding:13px;font:700 13.5px "Manrope",sans-serif;color:var(--ink);cursor:pointer}
  .google:hover{border-color:var(--ink)}
  .switch{text-align:center;font-size:13px;color:var(--muted);margin-top:20px}
  .switch a{color:var(--ink);font-weight:800}
  /* In production: <div id="clerk-captcha"> lives inside the sign-up variant of this form. */

  .proto-nav{position:fixed;right:14px;bottom:12px;font:600 11px/1 "Manrope",sans-serif;opacity:.45}
  .proto-nav a{color:var(--ink)}
  @media (prefers-reduced-motion: reduce){ .stop{animation:none} }
</style>
</head>
<body>
  <div class="term">
    <div class="route" aria-label="You are at the Entry stop">
      <div class="station here" aria-current="step"><span class="pip"></span><span class="name">Entry</span></div>
      <div class="seg"></div>
      <div class="station"><span class="pip"></span><span class="name">You</span></div>
      <div class="seg"></div>
      <div class="station"><span class="pip"></span><span class="name">Body</span></div>
      <div class="seg"></div>
      <div class="station"><span class="pip"></span><span class="name">Goal</span></div>
      <div class="seg"></div>
      <div class="station"><span class="pip"></span><span class="name" style="letter-spacing:0">··· Plan</span></div>
    </div>
  </div>

  <main>
    <div class="stop">
      <p class="pa">‣ PA: Returning riders, board at the front. New riders, tap “create account.”</p>
      <div class="sign">
        <span class="gate">Entry · Sign in</span>
        <h1 tabindex="-1">Welcome back to the line.</h1>
        <p>One sign-in takes you straight to your plan.</p>
      </div>

      <form onsubmit="return false">
        <label><span class="lab">Email</span>
          <input type="email" placeholder="you@example.com" autocomplete="email">
        </label>
        <label><span class="lab">Password</span>
          <input type="password" placeholder="••••••••" autocomplete="current-password">
        </label>
        <button class="submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
        <div class="or">transfer</div>
        <button class="google" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
      </form>
      <p class="switch">New rider? <a href="#">Create an account</a></p>
    </div>
  </main>
  <p class="proto-nav"><a href="../index.html">← all directions</a></p>
</body>
</html>

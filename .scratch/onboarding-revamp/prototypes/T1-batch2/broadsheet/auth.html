<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broadsheet — Auth · Stride T1-batch2</title>
<!--
  DIRECTION: BROADSHEET — "the morning paper of you"
  Mood: quiet editorial authority. Ink on warm paper, hairline rules, folios, serif headlines.
  TOKEN RECONCILIATION: uses ink/lavender/text tokens as-is.
  DELIBERATE EXTENSIONS (called out): paper background #faf8f2, Fraunces display serif,
  hairline rule color #ddd8ca. Everything else maps to existing tokens.
  Motion: page-settle (rise 16px + fade, 200ms) on the changing panel only; opacity-only under reduced motion.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#0d101b; --lavender:#b3a0ff; --lavender-deep:#3b1f8c;
    --paper:#faf8f2; --rule:#ddd8ca; --muted:#6a7081; --subtle:#9099ad;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ── Masthead / folio ── */
  .folio{max-width:1040px;margin:0 auto;width:100%;padding:18px 28px 0}
  .folio-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .folio-rule{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);height:6px;margin-top:8px}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .sheet{width:100%;max-width:420px;animation:settle .2s var(--ease) both}
  @keyframes settle{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .nameplate{text-align:center;margin-bottom:26px}
  .nameplate h1{font-family:"Fraunces",serif;font-weight:700;font-size:44px;letter-spacing:-.5px;line-height:1}
  .nameplate .tag{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .nameplate .rule{width:56px;height:1px;background:var(--ink);margin:14px auto 0}

  .edition{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px}
  .edition::before{content:"";width:7px;height:7px;background:var(--lavender);display:inline-block}
  h2{font-family:"Fraunces",serif;font-weight:600;font-size:26px;text-align:center;line-height:1.2}
  .lede{font-family:"Fraunces",serif;font-style:italic;font-size:14.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}

  form{margin-top:26px;border-top:1px solid var(--ink);padding-top:22px;display:grid;gap:16px}
  label{display:grid;gap:6px}
  label .lab{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
  input[type=email],input[type=password]{border:none;border-bottom:1px solid var(--rule);background:transparent;padding:8px 2px;font:500 15px "Manrope",sans-serif;color:var(--ink);outline:none;transition:border-color .15s}
  input:focus{border-bottom-color:var(--lavender-deep)}
  input::placeholder{color:var(--subtle)}
  .submit{margin-top:6px;background:var(--ink);color:#fff;border:none;padding:14px;font:700 12.5px "Manrope",sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:background .15s}
  .submit:hover{background:var(--lavender-deep)}
  .or{display:flex;align-items:center;gap:12px;color:var(--subtle);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;margin:2px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--rule)}
  .google{display:flex;align-items:center;justify-content:center;gap:10px;background:transparent;border:1px solid var(--ink);padding:12px;border-radius:3px;font:700 12.5px "Manrope",sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink);cursor:pointer}
  .google:hover{background:#f1ede1}
  .switch{text-align:center;font-size:13px;color:var(--muted);margin-top:20px}
  .switch a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1px solid var(--lavender)}
  .colophon{text-align:center;color:var(--subtle);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;padding:20px 0 26px}
  /* In production: <div id="clerk-captcha"> mounts inside the sign-up variant of this form; the ruled layout is height-flexible. */

  .proto-nav{position:fixed;right:14px;bottom:12px;font:600 11px/1 "Manrope",sans-serif;opacity:.45}
  .proto-nav a{color:var(--ink)}
  @media (prefers-reduced-motion: reduce){ .sheet{animation:none} }
</style>
</head>
<body>
  <div class="folio">
    <div class="folio-row"><span>Stride — Registration Desk</span><span>Established 2026</span></div>
    <div class="folio-rule" aria-hidden="true"></div>
  </div>

  <main>
    <div class="sheet">
      <div class="nameplate">
        <h1>Stride</h1>
        <p class="tag">The adaptive wellness daily</p>
        <div class="rule" aria-hidden="true"></div>
      </div>

      <p class="edition">Subscriber entrance</p>
      <h2 tabindex="-1">Welcome back to your column.</h2>
      <p class="lede">Sign in to pick up where your plan left off.</p>

      <form onsubmit="return false">
        <label><span class="lab">Email address</span>
          <input type="email" name="email" placeholder="you@example.com" autocomplete="email">
        </label>
        <label><span class="lab">Password</span>
          <input type="password" name="password" placeholder="••••••••" autocomplete="current-password">
        </label>
        <button class="submit" type="submit">Sign in</button>
        <div class="or">or</div>
        <button class="google" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
      </form>
      <p class="switch">New to the paper? <a href="#">Start a subscription</a></p>
    </div>
  </main>

  <p class="colophon">Stride · printed daily for one reader: you</p>
  <p class="proto-nav"><a href="../index.html">← all directions</a></p>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Thread (v2) — Onboarding · Stride T1-final</title>
<!--
  T1-final variation "SIGNAL THREAD" — v2 pass on top of v2-signal-thread-refined,
  responding to direct human feedback on that pass: "the card is too small, the
  number is half visible half not visible, the inputs are small and crammed."
  Three concrete changes, everything else carried forward unchanged:

  1. THE CARD IS NOW A GENUINELY BIG RECTANGLE. .card goes from
     max-width:480px/min-height:440px/padding:44px 40px to
     max-width:860px/min-height:760px/padding:64px 72px 56px (border-radius
     24px -> 32px to match). That's roughly double the footprint in both
     dimensions, not a cosmetic bump — the point is real room for the
     restructured controls in #3 to breathe in.

  2. THE GHOST-NUMERAL DEVICE IS GONE. The old .ghost-num was a
     position:absolute;inset:0 hollow numeral up to clamp(150px,30vw,230px)
     sitting behind the step content inside a card with overflow:hidden — at
     any card width smaller than the numeral's own footprint (which was
     guaranteed, the numeral was sized off viewport width not card width) it
     got cropped by the card edge. That read as broken, not intentional, and
     the human called it out directly. It is not resized or re-cropped here —
     it is deleted outright, CSS and JS both (no --dur-num-*, no --ease-classy
     enter/exit choreography on a numeral, no card overflow:hidden).

     In its place: a small, fully-visible step-chip in a normal-flow header
     row at the top of the card (.card-head), sized to its own content (a
     two-line mono chip: "01" over "OF 08"), aria-hidden since the real
     progress semantics live on the thread's role=progressbar + the live
     region, same as before. It is never bigger than the space allotted to
     it and the card no longer clips anything — there is nothing left inside
     it that could overflow its own box.

  3. STATS / WORK / TRAINING ARE RESTRUCTURED, NOT JUST RE-PADDED:
       - stats: the 4 number fields are no longer a tight 2-col grid of bare
         <input>s. Each is now a "stat tile" (.stat-field) — a bordered,
         padded card with a small mono label on top and a large (28px) number
         readout with its own unit suffix (yrs / kg / cm / %) below. Sex
         selection uses the same big .choice rectangles as everywhere else,
         just full-width under the tiles instead of squeezed beside them.
       - work: the old inline 56px-wide hours field crammed next to the
         choice grid is now its own full-width labelled row (.hours-field)
         with a real +/- stepper (34px circular buttons either side of a
         44px-wide readout) — a proper touch target, not a bare number input.
       - training: each workout row is now a small self-contained panel
         (.train-card): a top row with the type <select> (real padding, 15px
         font) and a 38px round remove button, then a 2-col grid of *labelled*
         steppers ("Minutes / session", "Sessions / week") below — the same
         stepper control introduced for work-hours, reused. No more one
         skinny row with a select + two 42px inputs + a remove button all
         mashed together.
     .choice itself also grew (min-height 108px -> 140px, more padding) since
     there's now room to make the existing uniform-rectangle device even more
     generous, per the brief.

  UNCHANGED FROM v2-signal-thread-refined: all 8 real phases (name -> stats ->
  goal -> work -> lifestyle -> training -> diet -> style) with their real copy/
  option sets lifted from apps/web/src/pages/OnboardingPage.tsx; the free-form
  "…or describe it your own way" affordance on every choice/field step; single
  centered axis, no side rail; no mascot art (Stry stays voice + signal dot);
  R1 motion ceiling on the step card itself (opacity+translateY, <=250ms,
  <=24px, collapsing to opacity-only under prefers-reduced-motion, one focused
  question per step, focus-to-<h2 tabindex="-1">, single polite live region
  sequenced after the focus move, validate-before-advance, real
  role=progressbar); R2 (separately-mounted screens, continuity via
  localStorage only — unchanged name+goal-label carry to plan-reveal.html).
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#0d101b; --lav:#b3a0ff; --lav-soft:#ede8ff; --bg:#f7f6f9; --card:#ffffff;
    --input:#f3f3f6; --text:#0d101b; --muted:#6a7081; --subtle:#5c6178;
    --border:#ebebef; --border-strong:#d9d9e0; --error:#b3261e;

    /* Step-card motion — R1 ceiling: <=250ms, translate <=24px, opacity-only
       under reduced-motion. Unchanged from the approved v2. */
    --dur:220ms; --dur-exit:150ms; --dur-exit-reduced:90ms;
    --ease:cubic-bezier(.22,1,.36,1); --ease-exit:cubic-bezier(.4,0,1,1);

    /* Thread segment lighting keeps its own calmer, symmetric ease — nothing
       to do with the (now-removed) ghost numeral, this always just governed
       the progress-bar fill. */
    --ease-classy:cubic-bezier(.65,0,.35,1);
    --dur-thread:340ms;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font:inherit}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

  /* Stry's presence: the same pulsing dot from auth.html, never a mascot render. */
  .dot{width:6px;height:6px;border-radius:50%;background:var(--lav);box-shadow:0 0 10px 2px rgba(179,160,255,.5);animation:pulse 3s ease-in-out infinite;flex-shrink:0}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .badge{position:fixed;top:24px;left:24px;display:flex;align-items:center;gap:9px;z-index:10;font-size:12px;font-weight:700;color:var(--muted)}

  /* ── Single centered axis. No rail column, no side-by-side grid. ── */
  .stagearea{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 24px 60px}

  .thread-wrap{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:34px;width:100%;max-width:420px}
  .thread{display:flex;gap:6px;width:100%}
  .thread .seg{flex:1;height:4px;border-radius:99px;background:var(--border-strong);transition:background var(--dur-thread) var(--ease-classy),box-shadow var(--dur-thread) var(--ease-classy)}
  .thread .seg.on{background:var(--lav);box-shadow:0 0 6px 0 rgba(179,160,255,.4)}
  .step-of{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--subtle);font-weight:500;letter-spacing:1.4px;text-transform:uppercase;transition:opacity 160ms var(--ease)}
  .step-of.dim{opacity:.35}

  /* ── The big rectangle. Roughly double the old 480x440 footprint — this is
       the direct fix for "make the card bigger, double its size." No
       overflow:hidden: nothing inside this card is sized to exceed its own
       box anymore, so there is nothing left to clip. ── */
  .card{position:relative;width:100%;max-width:860px;min-height:760px;background:var(--card);border:1px solid var(--border);border-radius:32px;padding:64px 72px 56px;box-shadow:0 40px 80px -40px rgba(13,16,27,.18)}
  .card-inner{position:relative}

  /* ── Step chip: replaces the old ghost-numeral entirely. A small, fully
       contained header element — never absolutely positioned over the card,
       never bigger than its own two-line content, so it can never be cropped
       by anything. Purely decorative/redundant with the real progressbar +
       live region, hence aria-hidden. ── */
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:32px;transition:opacity 160ms var(--ease)}
  .card-head.dim{opacity:.35}
  .step-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--lav-soft);border-radius:14px;padding:9px 16px;line-height:1.05;text-align:center}
  .step-chip-num{display:block;font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;color:var(--ink);letter-spacing:.5px}
  .step-chip-of{display:block;font-family:"JetBrains Mono",monospace;font-size:8.5px;font-weight:600;color:var(--subtle);letter-spacing:1.2px;margin-top:2px}

  .step{transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);will-change:opacity,transform}
  .step.exit{opacity:0;transition:opacity var(--dur-exit) var(--ease-exit)}
  .step.enter-from-below{opacity:0;transform:translateY(20px)}
  .step.enter-from-above{opacity:0;transform:translateY(-20px)}

  .persona-line{display:flex;align-items:center;gap:9px;color:var(--subtle);font-size:13.5px;font-style:italic;margin-bottom:18px}
  .gatetag{display:inline-block;background:var(--lav-soft);color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:500;letter-spacing:1px;padding:5px 12px;border-radius:9999px;text-transform:uppercase}
  h2{font-size:32px;font-weight:800;letter-spacing:-.6px;line-height:1.26;outline:none;max-width:640px;margin-bottom:4px}

  .field{margin-top:28px}
  .name-row{display:flex;gap:12px;margin-top:28px;max-width:520px}
  .name-row input,.text-input{flex:1;min-width:0;background:var(--input);border:1px solid var(--border);border-radius:14px;padding:17px 19px;font:600 17px "Manrope",sans-serif;color:var(--text);outline:none;transition:border-color .15s}
  .name-row input:focus,.text-input:focus{border-color:var(--lav)}
  .name-row input:focus-visible,.text-input:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
  .text-input{display:block;width:100%;max-width:560px;margin-top:22px;font-weight:500;font-size:15px;padding:15px 19px}

  /* ── Stats: four generous "stat tiles" instead of a cramped 2-col grid of
       bare number inputs. Each gets its own labelled card, a large readout,
       and an explicit unit — no more guessing which field wants kg vs cm. ── */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px;max-width:640px}
  .stat-field{background:var(--input);border:1px solid var(--border);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
  .stat-field:has(input:focus){border-color:var(--lav)}
  .stat-field .flab{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:1.1px;color:var(--subtle);text-transform:uppercase}
  .stat-field .input-row{display:flex;align-items:baseline;gap:8px}
  .stat-field input{background:transparent;border:none;font:800 28px "Manrope",sans-serif;color:var(--text);outline:none;width:100%;min-width:0;padding:0}
  .stat-field input::-webkit-outer-spin-button,.stat-field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stat-field input:focus-visible{outline:none}
  .stat-field .unit{flex-shrink:0;font-size:13.5px;color:var(--muted);font-weight:700}

  /* ── Choices: uniform, now genuinely generous rectangles — bigger again
       than the previous refined pass, since there's real room for it now. ── */
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px;max-width:640px}
  .choices.cols3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:560px){ .choices,.choices.cols3{grid-template-columns:1fr 1fr} }
  .choice{
    position:relative;min-height:140px;display:flex;flex-direction:column;justify-content:center;gap:6px;
    background:var(--input);border:1px solid var(--border);border-radius:18px;padding:26px 22px;
    text-align:left;cursor:pointer;font-family:inherit;color:var(--text);
    transition:border-color .12s var(--ease),background-color .16s var(--ease),opacity .16s var(--ease);
  }
  .choice:hover{border-color:var(--border-strong);background:#ececf1}
  .choice[aria-pressed="true"]{background:rgba(179,160,255,.14);border-color:var(--lav)}
  .choice[aria-pressed="true"]::after{content:"";position:absolute;top:16px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--lav)}
  .choice .label{display:block;font-size:15.5px;font-weight:700;line-height:1.3;color:var(--text)}
  .choice .sub{display:block;font-weight:500;color:var(--subtle);font-size:12.5px;margin-top:2px;line-height:1.35}
  .choice:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
  @keyframes choicePulse{0%{transform:scale(1)}45%{transform:scale(.965)}100%{transform:scale(1)}}
  .choice.picked{animation:choicePulse 260ms var(--ease)}
  .choices.deciding .choice:not([aria-pressed="true"]){opacity:.45}

  /* ── Shared stepper control: a real +/- touch target either side of a
       readout. Used for work-hours (full width, one field) and for each
       training row's duration/sessions (paired, inside a labelled column). ── */
  .stepper{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:9999px;padding:6px 8px}
  .stepper input{flex:1;min-width:0;width:44px;text-align:center;background:transparent;border:none;font:800 17px "Manrope",sans-serif;color:var(--text);outline:none}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper input:focus-visible{outline:none}
  .step-btn{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:none;background:var(--input);color:var(--text);font:800 17px "Manrope",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
  .step-btn:hover{background:var(--lav-soft)}
  .step-btn:focus-visible{outline:2px solid var(--lav);outline-offset:2px}

  /* ── Work-hours: was a tiny inline 56px input squeezed next to the choice
       grid. Now its own full-width labelled row with a real stepper. ── */
  .hours-field{margin-top:26px;max-width:640px;background:var(--input);border:1px solid var(--border);border-radius:18px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .hours-label{display:flex;flex-direction:column;gap:3px;min-width:0}
  .hours-title{font-weight:700;font-size:14.5px;color:var(--text)}
  .hours-sub{font-size:12px;color:var(--subtle)}
  .hours-field .stepper{flex-shrink:0}
  .hours-field .stepper input{width:40px}

  /* ── Training builder: each workout is its own panel now — a type select
       with real padding on top, then a labelled pair of steppers below,
       instead of one skinny row with five controls mashed together. ── */
  .train-rows{display:flex;flex-direction:column;gap:16px;margin-top:28px;max-width:640px}
  .train-card{background:var(--input);border:1px solid var(--border);border-radius:18px;padding:18px 20px 20px}
  .train-card-top{display:flex;align-items:center;gap:12px}
  .train-card-top select{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font:700 15px "Manrope",sans-serif;color:var(--text);outline:none;cursor:pointer}
  .train-card-top select:focus{border-color:var(--lav)}
  .train-card-top select:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
  .train-card-top .rm{flex-shrink:0;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer}
  .train-card-top .rm:hover{color:var(--error);border-color:var(--border)}
  .train-card-top .rm:focus-visible{outline:2px solid var(--lav);outline-offset:1px}
  .train-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  .train-field{display:flex;flex-direction:column;gap:8px}
  .train-field .flab{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1.1px;color:var(--subtle);text-transform:uppercase}
  .train-add{width:100%;max-width:640px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--border-strong);border-radius:16px;padding:16px;font:700 14px "Manrope",sans-serif;color:var(--muted);background:transparent;cursor:pointer}
  .train-add:hover{color:var(--text);border-color:var(--lav)}
  .train-add:focus-visible{outline:2px solid var(--lav);outline-offset:2px}

  /* ── Free-form input affordance — the FreeText equivalent. Present on every
       choice-driven step, styled after the real component: sparkle + input +
       round send button in one pill. ── */
  .freetext{margin-top:24px;max-width:560px}
  .freetext-pill{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:9999px;padding:10px 10px 10px 18px;transition:border-color .15s var(--ease)}
  .freetext-pill:focus-within{border-color:var(--lav)}
  .freetext-pill .spark{color:var(--lav);flex-shrink:0;display:flex}
  .freetext-pill input{flex:1;min-width:0;background:transparent;border:none;outline:none;font:500 14px "Manrope",sans-serif;color:var(--text)}
  .freetext-pill input::placeholder{color:var(--subtle)}
  .freetext-pill input:focus-visible{outline:none}
  .freetext-send{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .12s var(--ease)}
  .freetext-send:hover{opacity:.85}
  .freetext-send:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
  .ack{margin-top:9px;padding-left:6px;font-size:12.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
  .ack::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lav);flex-shrink:0}
  @keyframes ackIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .ack.show{animation:ackIn 180ms var(--ease)}

  .err{font-size:13px;color:var(--error);margin-top:16px;font-weight:600;max-width:560px}
  @keyframes errIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .err.show{animation:errIn 180ms var(--ease)}

  .nav{margin-top:40px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .nav-left{display:flex;align-items:center;gap:18px}
  .btn{border-radius:9999px;padding:15px 28px;font-weight:700;font-size:14.5px;border:none;cursor:pointer;font-family:inherit}
  .btn:focus-visible{outline:2px solid var(--lav);outline-offset:3px}
  .btn.primary{background:var(--ink);color:#fff;transition:opacity .12s var(--ease)}
  .btn.primary[aria-disabled="true"]{opacity:.35;cursor:not-allowed}
  .btn.text{background:transparent;color:var(--muted);padding:15px 0}
  .btn.text:hover{color:var(--text)}

  .proto-nav{position:fixed;right:14px;bottom:12px;font:600 11px/1 "Manrope",sans-serif;opacity:.45;z-index:5}
  .proto-nav a{color:var(--ink)}

  @media (prefers-reduced-motion: reduce){
    .step,.step.exit{transition:opacity var(--dur-exit-reduced) linear !important}
    .step.enter-from-below,.step.enter-from-above{transform:none}
    .thread .seg{transition:background var(--dur-exit-reduced) linear}
    .step-of,.card-head{transition:opacity var(--dur-exit-reduced) linear}
    .choice.picked{animation:none}
    .choice{transition:border-color .12s linear,background-color .12s linear,opacity .12s linear}
    .err.show,.ack.show{animation:none}
  }
  @media(max-width:900px){
    .card{padding:52px 44px}
  }
  @media(max-width:640px){
    .card{padding:36px 24px;border-radius:24px;min-height:0}
    .card-head{margin-bottom:22px}
    h2{font-size:25px}
    .stat-grid{grid-template-columns:1fr}
    .choice{min-height:108px;padding:20px 18px}
    .hours-field{flex-direction:column;align-items:flex-start;gap:14px}
    .train-fields{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <div class="badge"><span class="dot" aria-hidden="true"></span><span>Coached by Stry</span></div>

  <div class="stagearea">
    <div class="thread-wrap">
      <div class="thread" id="thread" role="progressbar" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1" aria-label="Onboarding progress"></div>
      <span class="step-of" id="stepOf">STEP 1 OF 8</span>
    </div>

    <div class="card" id="card">
      <div class="card-inner">
        <div class="card-head" id="cardHead">
          <span class="gatetag" id="gate"></span>
          <div class="step-chip" aria-hidden="true">
            <span class="step-chip-num" id="stepNum">01</span>
            <span class="step-chip-of">OF 08</span>
          </div>
        </div>
        <div class="step" id="step">
          <div class="persona-line"><span class="dot" aria-hidden="true"></span><span id="persona"></span></div>
          <h2 tabindex="-1" id="q"></h2>
          <div id="controls"></div>
          <p class="err" id="err" hidden></p>
          <div class="nav">
            <div class="nav-left">
              <button class="btn text" id="back" type="button">Back</button>
              <button class="btn text" id="skip" type="button" hidden>Skip</button>
            </div>
            <button class="btn primary" id="continue" type="button" aria-disabled="true">Continue</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="sr-only" role="status" aria-live="polite" id="live"></p>
  <p class="proto-nav"><a href="index.html">← start</a> · <a href="auth.html">auth</a> · <a href="plan-reveal.html">plan reveal →</a></p>

<script>
(function(){
  var REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var EXIT_MS = REDUCED ? 90 : 150;              // step-card exit (R1 ceiling)
  var PICK_HOLD_MS = REDUCED ? 160 : 260;
  var LEAVE_MS = REDUCED ? 90 : 190;
  var TOTAL = 8;
  var $ = function(id){ return document.getElementById(id); };

  /* ── Real option sets, lifted 1:1 from apps/web/src/pages/OnboardingPage.tsx ── */
  var GOALS = [
    { v:"aggressive_loss", name:"Lose fat fast", sub:"~25% deficit" },
    { v:"moderate_loss", name:"Lose fat", sub:"~18% deficit" },
    { v:"maintain", name:"Maintain", sub:"Stay here" },
    { v:"recomp", name:"Recomp", sub:"Lose fat, gain muscle" },
    { v:"lean_gain", name:"Lean gain", sub:"~10% surplus" },
    { v:"muscle_gain", name:"Build muscle", sub:"~18% surplus" }
  ];
  var WORK_OPTS = [
    { v:"desk", name:"Desk", sub:"Mostly seated" },
    { v:"mixed", name:"Mixed", sub:"Sit + move" },
    { v:"standing", name:"Standing", sub:"On your feet" },
    { v:"physical", name:"Physical", sub:"Manual labor" }
  ];
  var LIFESTYLE_OPTS = [
    { v:"sedentary", name:"Sedentary", sub:"Mostly sitting" },
    { v:"light", name:"Light", sub:"Some walking" },

  function sparkSVG(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9l4.4-1.4L12 3z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14z"/></svg>'; }

  function renderThread(now){

  function isValid(key){
    switch (key){

          isFinite(age) && age >= 10 && age <= 120 &&
          isFinite(w) && w > 0 && w < 500 &&
          isFinite(h) && h > 0 && h < 300;

      case "work": return state.occupationType !== "";
      case "lifestyle": return state.lifestyleActivity !== "";

  // A single "stat tile": label on top, a big number readout with a unit
  // suffix below. Replaces the old bare-<input>-in-a-tight-grid layout.
  function fieldInput(labelText, value, onChange, placeholder, id, unit){
    var tile = document.createElement("div"); tile.className = "stat-field";
    var lab = document.createElement("span"); lab.className = "flab"; lab.textContent = labelText;
    var row = document.createElement("div"); row.className = "input-row";
    var input = document.createElement("input");
    input.type = "number"; input.id = id; input.value = value; input.placeholder = placeholder || "";
    input.addEventListener("input", function(){ onChange(input.value); });
    row.appendChild(input);
    if (unit){ var u = document.createElement("span"); u.className = "unit"; u.textContent = unit; row.appendChild(u); }
    tile.appendChild(lab); tile.appendChild(row);
    return tile;
  }

  // A real +/- stepper: 34px round buttons flanking a text-centered readout.
  // Used for work-hours and for each training row's duration/sessions.
  function buildStepper(value, min, max, ariaLabel, onChange){
    var wrap = document.createElement("div"); wrap.className = "stepper";
    var minus = document.createElement("button");
    minus.type = "button"; minus.className = "step-btn"; minus.setAttribute("aria-label", "Decrease " + ariaLabel); minus.textContent = "–";
    var input = document.createElement("input");
    input.type = "number"; input.min = String(min); input.max = String(max); input.value = value; input.setAttribute("aria-label", ariaLabel);
    var plus = document.createElement("button");
    plus.type = "button"; plus.className = "step-btn"; plus.setAttribute("aria-label", "Increase " + ariaLabel); plus.textContent = "+";
    function clamp(v){ return Math.max(min, Math.min(max, v || 0)); }
    minus.addEventListener("click", function(){ input.value = clamp((+input.value || 0) - 1); onChange(input.value); });
    plus.addEventListener("click", function(){ input.value = clamp((+input.value || 0) + 1); onChange(input.value); });
    input.addEventListener("input", function(){ onChange(input.value); });
    wrap.appendChild(minus); wrap.appendChild(input); wrap.appendChild(plus);
    return wrap;
  }

  function makeChoiceGroup(options, cols, activeGetter, onPick){
    var group = document.createElement("div");
    group.className = "choices" + (cols === 3 ? " cols3" : "");
    group.setAttribute("role", "group");
    group.setAttribute("aria-labelledby", "q");

    group.setAttribute("aria-invalid", "false");
    group.id = "options";
    options.forEach(function(o){
      var b = document.createElement("button");
      b.type = "button"; b.className = "choice"; b.dataset.v = o.v;
      b.setAttribute("aria-pressed", activeGetter() === o.v ? "true" : "false");
      b.innerHTML = "<span class=\"label\">" + o.name + "</span>" + (o.sub ? "<span class=\"sub\">" + o.sub + "</span>" : "");
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(group.querySelectorAll(".choice"), function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        $("err").hidden = true; $("err").classList.remove("show"); group.setAttribute("aria-invalid", "false");
        if (!REDUCED){ b.classList.remove("picked"); void b.offsetWidth; b.classList.add("picked"); }
        onPick(o.v, b);
      });
      group.appendChild(b);
    });
    return group;
  }
  function refreshChoiceGroup(group, activeGetter){
    Array.prototype.forEach.call(group.querySelectorAll(".choice"), function(b){
      b.setAttribute("aria-pressed", b.dataset.v === activeGetter() ? "true" : "false");
    });

  function buildFreeText(host, cfg){
    var wrap = document.createElement("div"); wrap.className = "freetext";
    var pill = document.createElement("div"); pill.className = "freetext-pill";
    var iconSpan = document.createElement("span"); iconSpan.className = "spark"; iconSpan.innerHTML = sparkSVG();
    var input = document.createElement("input");
    input.type = "text"; input.placeholder = cfg.placeholder;
    input.setAttribute("aria-label", "Describe in your own words instead");
    var send = document.createElement("button");
    send.type = "button"; send.className = "freetext-send"; send.setAttribute("aria-label", "Send"); send.innerHTML = sendSVG();
    pill.appendChild(iconSpan); pill.appendChild(input); pill.appendChild(send);
    var ack = document.createElement("p"); ack.className = "ack"; ack.setAttribute("role", "status"); ack.hidden = true;
    wrap.appendChild(pill); wrap.appendChild(ack);
    function submit(){
      var text = input.value.trim(); if (!text) return;
      var result = cfg.onParse(text) || {};
      ack.hidden = false; ack.textContent = result.message || "Got it.";
      if (!REDUCED){ ack.classList.remove("show"); void ack.offsetWidth; ack.classList.add("show"); }
      if (result.clear !== false) input.value = "";
      if (result.advance) scheduleAutoAdvance();
    }
    send.addEventListener("click", submit);
    input.addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); submit(); } });
    host.appendChild(wrap);
  }

  /* ── Stub "parsers" — no backend here, so these are small keyword/regex
       heuristics standing in for the real AI parse action. Good enough to
       demo the interaction: fill fields, pick a matching option, and
       acknowledge — mirroring which real onParsed calls also auto-advance
       (goal/lifestyle/style) vs. only fill fields (stats/work/diet/training). ── */
  function parseTrainingText(text){
    var chunks = text.split(/,| and /i), out = [];
    chunks.forEach(function(chunk){
      var t = chunk.toLowerCase(), type = null;
      if (/strength|lift|weights|gym/.test(t)) type = "strength";
      else if (/sprint|fast run/.test(t)) type = "run_fast";
      else if (/run|jog/.test(t)) type = "run_slow";
      else if (/cycl|bike/.test(t)) type = "cycling";
      else if (/hiit/.test(t)) type = "hiit";
      else if (/yoga/.test(t)) type = "yoga";
      else if (/swim/.test(t)) type = "swim";
      else if (/walk/.test(t)) type = "walk";
      else if (/sport|basketball|football|tennis|soccer/.test(t)) type = "sport";
      if (!type) return;
      var sessM = t.match(/(\d+)\s*x/) || t.match(/(\d+)\s*(?:times|sessions)/);
      var durM = t.match(/(\d+)\s*(?:min|minutes|h\b|hour|hr)/);
      var dur = 60;
      if (durM){ dur = parseInt(durM[1], 10); if (/h\b|hour|hr/.test(durM[0])) dur *= 60; }
      var sess = sessM ? Math.max(1, parseInt(sessM[1], 10)) : 3;
      out.push({ type:type, durationMin:dur, sessionsPerWeek:sess });
    });
    return out;
  }

  function buildControls(host, step){
    host.innerHTML = "";
    switch (step.key){

      case "name": {
        var row = document.createElement("div"); row.className = "name-row";
        var input = document.createElement("input");
        input.type = "text"; input.id = "nameInput"; input.placeholder = "Your name";

        // for every step, text or choice, so the a11y contract stays uniform.
        // Also deliberately no separate free-text row here — this whole control
        // already IS a free-form field, so the "describe it your own way"
        // affordance required on the choice-driven steps would be redundant.
        break;
      }

      case "stats": {
        var grid = document.createElement("div"); grid.className = "stat-grid";
        grid.appendChild(fieldInput("Age", state.age, function(v){ state.age = v; updateContinue(); }, "28", "ageInput", "yrs"));
        grid.appendChild(fieldInput("Weight", state.weight, function(v){ state.weight = v; updateContinue(); }, "65", "weightInput", "kg"));
        grid.appendChild(fieldInput("Height", state.height, function(v){ state.height = v; updateContinue(); }, "170", "heightInput", "cm"));
        grid.appendChild(fieldInput("Body fat (optional)", state.bodyFat, function(v){ state.bodyFat = v; updateContinue(); }, "18", "bodyFatInput", "%"));
        host.appendChild(grid);

        var sexGroup = makeChoiceGroup(
          [{ v:"female", name:"Female" }, { v:"male", name:"Male" }], 2,
          function(){ return state.sex; },
          function(v){ state.sex = v; updateContinue(); }
        );
        sexGroup.style.marginTop = "18px";
        host.appendChild(sexGroup);

        buildFreeText(host, {
          placeholder: "…or: 28yo male, 80kg, 178cm",
          onParse: function(text){
            var t = text, found = 0;
            var ageM = t.match(/(\d{1,3})\s*(?:yo\b|y\.?o\.?\b|years?\s*old|yrs?\b)/i) || t.match(/\bage\s*(\d{1,3})/i);
            if (ageM){ state.age = ageM[1]; $("ageInput").value = ageM[1]; found++; }
            var wM = t.match(/(\d{2,3}(?:\.\d+)?)\s*kg/i);
            if (wM){ state.weight = wM[1]; $("weightInput").value = wM[1]; found++; }
            var hM = t.match(/(\d{2,3})\s*cm/i);
            if (hM){ state.height = hM[1]; $("heightInput").value = hM[1]; found++; }
            var bfM = t.match(/(\d{1,2})\s*%\s*(?:bf|body\s*fat)?/i);
            if (bfM){ state.bodyFat = bfM[1]; $("bodyFatInput").value = bfM[1]; found++; }
            var sexM = /\b(male|man|guy)\b/i.test(t) ? "male" : (/\b(female|woman|girl)\b/i.test(t) ? "female" : null);
            if (sexM){ state.sex = sexM; refreshChoiceGroup(sexGroup, function(){ return state.sex; }); found++; }
            updateContinue();
            if (found > 0) return { message:"Got it — filled in what I could from that.", advance:false };
            return { message:"Didn't catch specifics there — try the fields above or a clearer sentence.", advance:false, clear:false };
          }
        });
        break;
      }

      case "goal": {
        var goalGroup = makeChoiceGroup(GOALS, 3, function(){ return state.goal; }, function(v){
          state.goal = v; updateContinue(); scheduleAutoAdvance();
        });
        host.appendChild(goalGroup);
        buildFreeText(host, {
          placeholder: "…or describe your goal",
          onParse: function(text){
            var t = text.toLowerCase();
            var match = GOALS.find(function(g){ return t.indexOf(g.name.toLowerCase()) > -1; });
            if (!match){
              if (/fast|quick|aggressive/.test(t) && /lose|fat|cut/.test(t)) match = GOALS.find(function(g){ return g.v === "aggressive_loss"; });
              else if (/lose|cut|fat loss|deficit|shred/.test(t)) match = GOALS.find(function(g){ return g.v === "moderate_loss"; });
              else if (/maintain|stay|same weight/.test(t)) match = GOALS.find(function(g){ return g.v === "maintain"; });
              else if (/recomp|both|tone up/.test(t)) match = GOALS.find(function(g){ return g.v === "recomp"; });
              else if (/lean gain|lean bulk|slow gain/.test(t)) match = GOALS.find(function(g){ return g.v === "lean_gain"; });
              else if (/muscle|bulk|gain weight|build/.test(t)) match = GOALS.find(function(g){ return g.v === "muscle_gain"; });
            }

              state.goal = match.v; refreshChoiceGroup(goalGroup, function(){ return state.goal; }); updateContinue();

      case "work": {
        var workGroup = makeChoiceGroup(WORK_OPTS, 2, function(){ return state.occupationType; }, function(v){
          state.occupationType = v; updateContinue();
        });

        var hrsField = document.createElement("div"); hrsField.className = "hours-field";
        var hLabelWrap = document.createElement("div"); hLabelWrap.className = "hours-label";

      case "lifestyle": {

        host.appendChild(lsGroup);
        buildFreeText(host, {
          placeholder: "…or: pretty lazy outside the gym",
          onParse: function(text){
            var t = text.toLowerCase(), match = null;
            if (/sedentary|barely move|lazy|mostly sit/.test(t)) match = LIFESTYLE_OPTS.find(function(o){ return o.v === "sedentary"; });
            else if (/light|some walk/.test(t)) match = LIFESTYLE_OPTS.find(function(o){ return o.v === "light"; });
            else if (/moderate|on my feet/.test(t)) match = LIFESTYLE_OPTS.find(function(o){ return o.v === "moderate"; });
            else if (/active|always moving|very active/.test(t)) match = LIFESTYLE_OPTS.find(function(o){ return o.v === "active"; });

      case "training": {
        var rowsWrap = document.createElement("div"); rowsWrap.className = "train-rows";

            var t = text.toLowerCase(), found = false;
            var opt = DIET_OPTS.find(function(o){ return t.indexOf(o.name.toLowerCase()) > -1; });
            if (!opt && /no preference|anything|omnivore|eat everything/.test(t)) opt = DIET_OPTS.find(function(o){ return o.v === "none"; });
            if (opt){ state.dietaryPreference = opt.v; refreshChoiceGroup(dietGroup, function(){ return state.dietaryPreference; }); found = true; }
            var avoidM = text.match(/(?:allergic to|allergy to|avoid|no)\s+([a-zA-Z ,]+)/i);
            if (avoidM){ state.allergies = avoidM[1].trim(); allergyInput.value = state.allergies; found = true; }
            updateContinue();
            if (found) return { message:"Got it — noted.", advance:false };
            return { message:"Didn't catch a preference there — try the choices above.", advance:false, clear:false };
          }
        });
        break;
      }

      case "style": {
        var styleGroup = makeChoiceGroup(STYLE_OPTS, 3, function(){ return state.coachingStyle; }, function(v){
          state.coachingStyle = v; updateContinue(); scheduleAutoAdvance();
        });
        host.appendChild(styleGroup);
        buildFreeText(host, {
          placeholder: "…or: keep it warm and simple",
          onParse: function(text){
            var t = text.toLowerCase(), match = null;
            if (/gentle|warm|kind|soft/.test(t)) match = STYLE_OPTS.find(function(o){ return o.v === "gentle"; });
            else if (/motivat|energy|hype|push|intense/.test(t)) match = STYLE_OPTS.find(function(o){ return o.v === "motivating"; });
            else if (/analyt|data|numbers|logic/.test(t)) match = STYLE_OPTS.find(function(o){ return o.v === "analytical"; });
            if (match){
              state.coachingStyle = match.v; refreshChoiceGroup(styleGroup, function(){ return state.coachingStyle; }); updateContinue();
              return { message:"Got it — set to “" + match.name + ".”", advance:true };
            }
            return { message:"Didn't catch a style there — try one of the options above.", advance:false, clear:false };
          }
        });
        break;
      }
    }
  }

  function paint(){
    var step = STEPS[i], now = i + 1;
    $("stepNum").textContent = String(now).padStart(2, "0");
    $("stepOf").textContent = "STEP " + now + " OF " + TOTAL;
    renderThread(now);
    $("gate").textContent = step.gate;
    $("q").textContent = step.q;
    $("persona").textContent = step.personaFn(state);
    $("skip").hidden = step.key !== "training";
    buildControls($("controls"), step);
    $("err").hidden = true;
    $("err").classList.remove("show");
    $("err").textContent = step.err;
    $("continue").setAttribute("aria-disabled", isValid(step.key) ? "false" : "true");
    $("back").style.visibility = i === 0 ? "hidden" : "visible";
    $("q").setAttribute("tabindex", "-1");
    $("q").focus({ preventScroll:true });
    clearTimeout(paint._live);
    paint._live = setTimeout(function(){
      $("live").textContent = "Step " + now + " of " + TOTAL + ": " + step.gate;
    }, 60); // sequenced after the focus move — never announced in the same tick (R1)
  }

  // Only the step card itself carries the R1-bounded slide+fade now — the
  // header step-chip just dims/undims with the outer "STEP X OF N" label
  // (same treatment, no separate motion budget to coordinate since there's
  // no giant numeral to wait on anymore).
  function render(dir){
    var el = $("step");
    clearTimeout(autoAdvanceTimer);
    if (!dir){ paint(); return; }
    el.classList.add("exit");
    $("stepOf").classList.add("dim");
    $("cardHead").classList.add("dim");
    setTimeout(function(){
      el.classList.remove("exit");
      var enterCls = dir === 1 ? "enter-from-below" : "enter-from-above";
      el.classList.add(enterCls);
      paint();
      $("stepOf").classList.remove("dim");
      $("cardHead").classList.remove("dim");
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          el.classList.remove("enter-from-below", "enter-from-above");
        });
      });
    }, EXIT_MS);
  }

  function tryAdvance(){
    var step = STEPS[i];
    if (!isValid(step.key)){
      $("err").hidden = false;
      $("err").classList.remove("show"); void $("err").offsetWidth; $("err").classList.add("show");
      var group = $("options"); if (group) group.setAttribute("aria-invalid", "true");
      var input = $("nameInput"); if (input) input.setAttribute("aria-invalid", "true");
      $("live").textContent = step.err;
      return;
    }
    if (i + 1 >= STEPS.length){
      // Real onboarding has a hard session/route boundary between screens (R2) —
      // nothing stays mounted, so anything worth carrying forward has to survive
      // via persistence, not shared state. Extends the existing name-carry
      // pattern one field further: the picked goal label.
      try {
        localStorage.setItem("strideProtoName", state.firstName.trim());
        var goalOpt = GOALS.find(function(g){ return g.v === state.goal; });
        if (goalOpt) localStorage.setItem("strideProtoGoalLabel", goalOpt.name.toLowerCase());
      } catch (e) {}
      leaveTo("plan-reveal.html");
      return;
    }
    i++; render(1);
  }

  function goBack(){
    if (i === 0) return;
    i--; render(-1);
  }

  function leaveTo(url){
    var scene = $("card"), wrap = document.querySelector(".thread-wrap"), badge = document.querySelector(".badge");
    [scene, wrap, badge].forEach(function(el){ if (el){ el.style.transition = "opacity " + LEAVE_MS + "ms cubic-bezier(.4,0,1,1)"; el.style.opacity = "0"; } });
    setTimeout(function(){ location.href = url; }, LEAVE_MS);
  }

  $("continue").addEventListener("click", tryAdvance);
  $("back").addEventListener("click", goBack);
  $("skip").addEventListener("click", tryAdvance);
  render(0);
})();
</script>
</body>
</html>

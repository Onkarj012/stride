<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Thread (v2) — Stride T1-final</title>
<!--
  T1-final variation "SIGNAL THREAD" — v2 pass, carried forward from
  v2-signal-thread-refined/index.html unchanged except this note and a small
  proportion bump. See onboarding.html in this same folder for the substantive
  changes in this pass: the card there roughly doubled in footprint, the old
  giant cropped ghost-numeral was deleted outright (replaced with a small,
  fully-visible header step-chip), and the stats/work/training controls were
  restructured for room to breathe instead of just re-padded.

  This screen isn't a "card" (no boxed container, no ghost-numeral device to
  fix) so nothing here was structurally broken. The one change: .scene grew
  from 380px to 460px max-width and its type scaled up slightly, so it reads
  as part of the same now-larger-scaled system rather than a small opening
  beat in front of a suddenly-huge onboarding card.

  "Begin" is the one real path through the whole arc: index -> auth ->
  onboarding (8 steps) -> plan reveal.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#0c0e16; --line-strong:#2c3045;
    --text:#eceaf5; --muted:#8b91a6; --subtle:#9aa0b8;
    --lav:#b3a0ff;
    --dur:260ms; --dur-exit:190ms; --ease:cubic-bezier(.22,1,.36,1); --ease-exit:cubic-bezier(.4,0,1,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}

  .topline{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;color:var(--subtle);text-transform:uppercase}
  .topline .brand{color:var(--text);font-weight:700}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .scene{position:relative;width:100%;max-width:460px;text-align:center;display:flex;flex-direction:column;align-items:center;animation:lit var(--dur) var(--ease) both;transition:opacity var(--dur-exit) var(--ease-exit),transform var(--dur-exit) var(--ease-exit)}
  .scene.leaving{opacity:0;transform:translateY(-10px) scale(.985)}
  @keyframes lit{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .ghost-s{position:absolute;top:-76px;left:50%;transform:translateX(-50%);font-size:440px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--lav);opacity:.055;pointer-events:none;z-index:0;user-select:none}

  .content{position:relative;z-index:1}
  .mark{width:14px;height:14px;border-radius:50%;background:var(--lav);box-shadow:0 0 18px 4px rgba(179,160,255,.55);margin:0 auto;animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  h1{font-size:34px;font-weight:800;letter-spacing:-.6px;margin-top:24px;line-height:1.15}
  .sub{font-size:14.5px;color:var(--muted);margin-top:11px;line-height:1.6;max-width:360px;margin-inline:auto}

  .begin{margin-top:34px;background:var(--lav);color:#0d101b;border:none;border-radius:9999px;padding:16px 36px;font:800 14.5px "Manrope",sans-serif;cursor:pointer;box-shadow:0 0 26px -6px rgba(179,160,255,.65);transition:box-shadow .15s,transform .15s}
  .begin:hover{box-shadow:0 0 36px -4px rgba(179,160,255,.85)}
  .begin:active{transform:scale(.98)}
  .begin:focus-visible{outline:2px solid var(--lav);outline-offset:3px}

  .variant{margin-top:28px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1.6px;color:var(--subtle);text-transform:uppercase}

  .proto-nav{position:fixed;right:14px;bottom:12px;font:600 11px/1 "Manrope",sans-serif;opacity:.4;z-index:5}
  .proto-nav a{color:var(--text)}
  @media (prefers-reduced-motion: reduce){
    .scene{animation:none;transition:opacity 90ms linear}
    .scene.leaving{transform:none}
    .mark{animation:none}
  }
</style>
</head>
<body>
  <div class="topline"><span class="brand">STRIDE</span><span>signal thread — v2</span></div>

  <main>
    <div class="scene" id="scene">
      <span class="ghost-s" aria-hidden="true">S</span>
      <div class="content">
        <div class="mark" aria-hidden="true"></div>
        <h1>The studio, from the top.</h1>
        <p class="sub">Sign in, answer eight focused questions — or just describe yourself in your own words — and watch the plan resolve. One continuous thread, start to finish.</p>
        <button class="begin" type="button" id="beginBtn">Begin</button>
        <p class="variant">T1-final · v2 · signal thread</p>
      </div>
    </div>
  </main>
  <p class="proto-nav"><a href="auth.html">auth</a> · <a href="onboarding.html">onboarding</a> · <a href="plan-reveal.html">plan reveal</a></p>

<script>
(function(){
  var scene = document.getElementById("scene");
  var REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var LEAVE_MS = REDUCED ? 90 : 190;
  document.getElementById("beginBtn").addEventListener("click", function(){
    scene.classList.add("leaving");
    setTimeout(function(){ location.href = "auth.html"; }, LEAVE_MS);
  });
})();
</script>
</body>
</html>

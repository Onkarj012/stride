<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Thread (v3) — Auth · Stride T1-final</title>
<!--
  T1-final variation "SIGNAL THREAD" — v3 correction pass.

  Per the human's explicit direction (both the original refined pass and this
  correction), this screen's design stays untouched — dark chamber, signal-dot
  Stry, "Studio's open" line, form fields, all identical. The correction this
  round was specifically about onboarding.html's card shape/size and its ghost
  numeral, not this screen. The only change here is a small proportional nudge —
  .scene's max-width goes from 380px to 420px, matching index.html's same bump —
  so this screen reads as part of the same coherent set as the now-wider
  onboarding card, without actually redesigning anything about it. The decorative
  signal-thread device under the topline still shows 8 quiet segments to match
  the real 8-phase flow it hands off to on onboarding.html (segment count is
  otherwise purely aria-hidden texture here, not a counted progressbar — see the
  "Entry" quiet-state note below).

  1. Composition: everything stacks in one true centered column — a single visual
     axis that every screen in this set shares (auth / onboarding / plan-reveal all
     center a card on the same axis, so nothing feels like "furniture beside content").
  2. Grammar seeding: two devices are planted here, quietly, that pay off later:
       - the slim horizontal SIGNAL THREAD (the ticked bar under the topline) — the
         same component reappears active (now counting 8 real steps) on onboarding
         and resolved on plan-reveal.
       - a giant, barely-visible ghost "S" behind the chamber — the brand mark, not
         the Stry mascot. Onboarding replaces this glyph with ghost step-numerals;
         plan-reveal resolves it into the real, filled-in kcal number.
  3. Nothing about the chamber's copy, palette, or form fields changed. The signal
     dot + "Studio's open" line is untouched — Stry stays a voice + pulse of light,
     never character art.
  4. Sign-in / Google / "create your studio" all advance into the arc with a short
     shared exit transition (fade + settle) before navigating, so the hard page
     boundary (real Clerk apps have a hard signed-out/signed-in remount — see R2)
     reads as an intentional beat, not a jump cut.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#0c0e16; --card:#161927; --line:#21243a; --line-strong:#2c3045;
    --text:#eceaf5; --muted:#8b91a6; --subtle:#9aa0b8;
    --lav:#b3a0ff; --sky:#a0c6ff;
    --dur:220ms; --dur-exit:170ms; --ease:cubic-bezier(.22,1,.36,1); --ease-exit:cubic-bezier(.4,0,1,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .topline{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;color:var(--subtle);text-transform:uppercase;position:relative;z-index:2}
  .topline .brand{color:var(--text);font-weight:700}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .scene{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;animation:lit var(--dur) var(--ease) both;transition:opacity var(--dur-exit) var(--ease-exit),transform var(--dur-exit) var(--ease-exit)}
  .scene.leaving{opacity:0;transform:translateY(-10px) scale(.985)}
  @keyframes lit{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ── Signal thread: same component that becomes the real progressbar on
       onboarding.html and the resolved bar on plan-reveal.html. Here it is
       intentionally quiet — one lit segment, "ENTRY" — establishing the device
       before it has any real steps to count. Decorative only at this beat. */
  .thread-wrap{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:34px;width:100%}
  .thread{display:flex;gap:5px;width:100%;max-width:260px}
  .thread .seg{flex:1;height:3px;border-radius:99px;background:var(--line-strong);transition:background var(--dur) var(--ease)}
  .thread .seg.on{background:var(--lav);box-shadow:0 0 8px 0 rgba(179,160,255,.55)}
  .thread-label{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:2px;color:var(--subtle);text-transform:uppercase}

  /* ── Ghost brand mark: giant, near-invisible "S" behind the chamber. Not the
       Stry mascot — this is the app's own S-glyph, reduced to pure texture. It is
       replaced by ghost step-numerals the moment onboarding begins. */
  .ghost-s{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:340px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--lav);opacity:.05;pointer-events:none;z-index:0;user-select:none}

  .chamber{position:relative;z-index:1;width:100%}

  .signal{display:flex;align-items:center;gap:9px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--lav);box-shadow:0 0 10px 2px rgba(179,160,255,.55);animation:pulse 3s ease-in-out infinite;flex-shrink:0}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  h1{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:16px;line-height:1.2}
  .sub{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.55}

  form{margin-top:28px;display:grid;gap:18px}
  label{display:grid;gap:7px}
  .lab{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1.8px;color:var(--subtle);text-transform:uppercase}
  input{background:transparent;border:none;border-bottom:1px solid var(--line-strong);padding:9px 2px;color:var(--text);font:500 15px "Manrope",sans-serif;outline:none;transition:border-color .15s,box-shadow .15s;border-radius:0;width:100%}
  input:focus{border-bottom-color:var(--lav);box-shadow:0 1px 0 0 var(--lav),0 12px 28px -18px rgba(179,160,255,.8)}
  input::placeholder{color:var(--subtle)}
  .submit{margin-top:8px;background:var(--lav);color:#0d101b;border:none;border-radius:9999px;padding:14px;font:800 13.5px "Manrope",sans-serif;cursor:pointer;box-shadow:0 0 24px -6px rgba(179,160,255,.65);transition:box-shadow .15s;width:100%}
  .submit:hover{box-shadow:0 0 34px -4px rgba(179,160,255,.85)}
  .submit:focus-visible,.google:focus-visible,input:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
  .or{display:flex;align-items:center;gap:12px;color:var(--subtle);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:2px;margin:2px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .google{display:flex;align-items:center;justify-content:center;gap:10px;background:transparent;border:1px solid var(--line-strong);color:var(--text);border-radius:9999px;padding:13px;font:700 13px "Manrope",sans-serif;cursor:pointer;width:100%}
  .google:hover{border-color:var(--muted)}
  .switch{text-align:center;font-size:12.5px;color:var(--muted);margin-top:24px}
  .switch a{color:var(--lav);font-weight:700;text-decoration:none;cursor:pointer}
  /* In production: <div id="clerk-captcha"> sits inside this form on the sign-up variant; the chamber is height-flexible. */

  .proto-nav{position:fixed;right:14px;bottom:12px;font:600 11px/1 "Manrope",sans-serif;opacity:.4;z-index:5}
  .proto-nav a{color:var(--text)}
  @media (prefers-reduced-motion: reduce){
    .scene{animation:none;transition:opacity 90ms linear}
    .scene.leaving{transform:none}
    .dot{animation:none}
  }
</style>
</head>
<body>
  <div class="topline"><span class="brand">STRIDE</span><span>signal thread</span></div>

  <main>
    <div class="scene" id="scene">
      <span class="ghost-s" aria-hidden="true">S</span>

      <div class="thread-wrap" aria-hidden="true">
        <div class="thread">
          <span class="seg on"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
          <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
        </div>
        <span class="thread-label">Entry</span>
      </div>

      <div class="chamber">
        <p class="signal"><span class="dot" aria-hidden="true"></span>Studio's open</p>
        <h1 tabindex="-1" id="h1">Back in the studio.</h1>
        <p class="sub">Your plan kept the light on. Sign in to continue.</p>

        <form id="signinForm">
          <label><span class="lab">Email</span>
            <input type="email" placeholder="you@example.com" autocomplete="email">
          </label>
          <label><span class="lab">Password</span>
            <input type="password" placeholder="••••••••" autocomplete="current-password">
          </label>
          <button class="submit" type="submit">Sign in</button>
          <div class="or">or</div>
          <button class="google" type="button" id="googleBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
          </button>
        </form>
        <p class="switch">First visit? <a id="switchLink" tabindex="0" role="link">Create your studio</a></p>
      </div>
    </div>
  </main>
  <p class="proto-nav"><a href="index.html">← start</a> · <a href="onboarding.html">onboarding →</a></p>

<script>
(function(){
  var scene = document.getElementById("scene");
  var REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var LEAVE_MS = REDUCED ? 90 : 190;

  function leaveTo(url){
    scene.classList.add("leaving");
    setTimeout(function(){ location.href = url; }, LEAVE_MS);
  }

  document.getElementById("signinForm").addEventListener("submit", function(e){
    e.preventDefault();
    leaveTo("onboarding.html");
  });
  document.getElementById("googleBtn").addEventListener("click", function(){
    leaveTo("onboarding.html");
  });
  document.getElementById("switchLink").addEventListener("click", function(){
    leaveTo("onboarding.html");
  });
  document.getElementById("switchLink").addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); leaveTo("onboarding.html"); }
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dial Snap — Auth · Stride T1-combined</title>
<!--
  COMBINED DIRECTION — variation "DIAL SNAP" (fast / pure crossfade / centered dial).
  DNA sources: numeral+type from T1/coachs-notebook/onboarding.html; auth chamber from
  T1-batch2/darkroom/auth.html; structure+motion blended from wayfinding + soft-terrain,
  reduced to their common denominator (persistent progress chrome, step-card-only motion)
  rather than either one's specific layout.
  Stry stays a signal dot here, same as every variation's auth screen.
  MOTION SIGNATURE (this variation only): pure opacity crossfade, NO translate at all,
  150ms — the fastest and simplest of the three variations, right at R1's floor. No
  direction, no rise, no swing: the chamber simply resolves into view. This is the
  contrast case against rail-drift's vertical drift and route-swing's horizontal slide.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#0c0e16; --card:#161927; --line:#21243a; --line-strong:#2c3045;
    --text:#eceaf5; --muted:#8b91a6; --subtle:#5b6178;
    --lav:#b3a0ff; --sky:#a0c6ff;
    --dur:150ms; --ease:ease-out;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .topline{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;color:var(--subtle);text-transform:uppercase}
  .topline .brand{color:var(--text);font-weight:700}
  .dialbadge{display:flex;align-items:center;gap:8px}
  .dialbadge svg{display:block}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .chamber{width:100%;max-width:360px;opacity:0;animation:snap var(--dur) var(--ease) both}
  @keyframes snap{to{opacity:1}}

  .signal{display:flex;align-items:center;gap:9px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--lav);box-shadow:0 0 10px 2px rgba(179,160,255,.55);animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  h1{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:16px;line-height:1.2}
  .sub{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.55}

  form{margin-top:28px;display:grid;gap:18px}
  label{display:grid;gap:7px}
  .lab{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1.8px;color:var(--subtle);text-transform:uppercase}
  input{background:transparent;border:none;border-bottom:1px solid var(--line-strong);padding:9px 2px;color:var(--text);font:500 15px "Manrope",sans-serif;outline:none;transition:border-color .15s,box-shadow .15s;border-radius:0}
  input:focus{border-bottom-color:var(--lav);box-shadow:0 1px 0 0 var(--lav),0 12px 28px -18px rgba(179,160,255,.8)}
  input::placeholder{color:var(--subtle)}
  .submit{margin-top:8px;background:var(--lav);color:#0d101b;border:none;border-radius:9999px;padding:14px;font:800 13.5px "Manrope",sans-serif;cursor:pointer;box-shadow:0 0 24px -6px rgba(179,160,255,.65);transition:box-shadow .15s}
  .submit:hover{box-shadow:0 0 34px -4px rgba(179,160,255,.85)}
  .submit:focus-visible, .google:focus-visible, input:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
  .or{display:flex;align-items:center;gap:12px;color:var(--subtle);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:2px;margin:2px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .google{display:flex;align-items:center;justify-content:center;gap:10px;background:transparent;border:1px solid var(--line-strong);color:var(--text);border-radius:9999px;padding:13px;font:700 13px "Manrope",sans-serif;cursor:pointer}
  .google:hover{border-color:var(--muted)}
  .switch{text-align:center;font-size:12.5px;color:var(--muted);margin-top:24px}
  .switch a{color:var(--lav);font-weight:700;text-decoration:none}

  .proto-nav{position:fixed;right:14px;bottom:12px;font:600 11px/1 "Manrope",sans-serif;opacity:.45}
  .proto-nav a{color:var(--text)}
  @media (prefers-reduced-motion: reduce){
    .chamber{animation-duration:1ms}
    .dot{animation:none}
  }
</style>
</head>
<body>
  <div class="topline">
    <span class="brand">STRIDE</span>
    <span class="dialbadge">dial · 00
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="#2c3045" stroke-width="2"/>
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="#b3a0ff" stroke-width="2" stroke-dasharray="40.8" stroke-dashoffset="35" stroke-linecap="round" transform="rotate(-90 8 8)"/>
      </svg>
    </span>
  </div>

  <main>
    <div class="chamber">
      <p class="signal"><span class="dot" aria-hidden="true"></span>Studio's open</p>
      <h1 tabindex="-1">Back in the studio.</h1>
      <p class="sub">Your plan kept the light on. Sign in to continue.</p>

      <form onsubmit="return false">
        <label><span class="lab">Email</span>
          <input type="email" placeholder="you@example.com" autocomplete="email">
        </label>
        <label><span class="lab">Password</span>
          <input type="password" placeholder="••••••••" autocomplete="current-password">
        </label>
        <button class="submit" type="submit">Sign in</button>
        <div class="or">or</div>
        <button class="google" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
      </form>
      <p class="switch">First visit? <a href="#">Create your studio</a></p>
    </div>
  </main>
  <p class="proto-nav"><a href="../index.html">← all variations</a> · <a href="onboarding.html">onboarding →</a></p>
</body>
</html>

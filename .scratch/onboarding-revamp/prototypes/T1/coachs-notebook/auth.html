<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride — Coach's Notebook (Sign up)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#0d101b; --lavender:#b3a0ff; --error:#d93025;
    --bg:#f8f8f8; --card:#ffffff; --input:#f3f3f5;
    --text:#0d101b; --text-muted:#6a7081; --text-subtle:#9099ad;
    --border:#ebebef; --border-strong:#d9d9e0;
    --font:"Manrope",system-ui,sans-serif;
    --dur-base:250ms; --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;display:flex;-webkit-font-smoothing:antialiased}

  .badge{position:fixed;top:24px;left:24px;display:flex;align-items:center;gap:8px;z-index:10}
  .badge .avatar{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--border-strong);overflow:hidden;display:grid;place-items:center}
  .pixel-avatar{width:26px;height:26px}
  .badge span{font-size:12px;font-weight:700;color:var(--text-muted)}

  .panel{width:44%;background:var(--lavender);display:flex;flex-direction:column;justify-content:center;padding:0 60px;position:relative}
  .panel .hollow{font-size:clamp(90px,14vw,160px);font-weight:800;letter-spacing:-4px;color:transparent;-webkit-text-stroke:2px var(--ink);line-height:.8}
  .panel h2{font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.8px;margin-top:10px;max-width:340px}
  .panel p{margin-top:14px;color:rgba(13,16,27,.7);font-size:14.5px;max-width:320px;line-height:1.55}

  .form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 32px}
  .form-wrap{width:100%;max-width:380px}
  .form-wrap h1{font-size:26px;font-weight:800;letter-spacing:-.4px}
  .form-wrap .sub{margin-top:6px;color:var(--text-muted);font-size:14px}
  .form-wrap .sub a{color:var(--text);font-weight:700;text-decoration:underline;text-decoration-color:var(--border-strong)}

  form{margin-top:24px;display:flex;flex-direction:column;gap:14px}
  .lbl{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}
  .field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;transition:border-color var(--dur-base) var(--ease)}
  .field:focus-within{border-color:var(--lavender)}
  .field input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit}
  .field input::placeholder{color:var(--text-subtle)}

  .btn{border-radius:9999px;padding:13px;font-weight:700;font-size:14px;border:none;cursor:pointer;width:100%;font-family:inherit}
  .btn:focus-visible{outline:2px solid var(--lavender);outline-offset:3px}
  .btn.primary{background:var(--ink);color:#fff;margin-top:4px}
  .divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text-subtle);font-size:11px;text-transform:uppercase;font-weight:700}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
  .btn.ghost{background:#fff;border:1px solid var(--border-strong);color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px}

  .checklist{margin-top:26px;border-top:1px solid var(--border);padding-top:16px}
  .checklist .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-subtle);padding:3px 0}
  .checklist .row b{color:var(--text-muted);font-weight:700}

  @media(max-width:820px){.panel{display:none}}
</style>
</head>
<body>
  <div class="badge"><span class="avatar"><span class="pixel-avatar" id="stry" role="img" aria-label="Stry"></span></span><span>Coached by Stry</span></div>

  <aside class="panel">
    <span class="hollow">00</span>
    <h2>Chapter zero. Before we start, an account.</h2>
    <p>Your plan lives here — sign in on any device and pick up exactly where you left off.</p>
  </aside>

  <div class="form-side">
    <div class="form-wrap">
      <h1>Create your account</h1>
      <p class="sub"><a href="#">Sign in</a> if you already have one</p>
      <form onsubmit="return false">
        <label><span class="lbl">First name</span><div class="field"><input placeholder="Sandra" autocomplete="given-name"></div></label>
        <label><span class="lbl">Email</span><div class="field"><input type="email" placeholder="you@example.com" autocomplete="email"></div></label>
        <label><span class="lbl">Password</span><div class="field"><input type="password" placeholder="At least 8 characters" autocomplete="new-password"></div></label>
        <div id="clerk-captcha" aria-hidden="true"></div>
        <button class="btn primary" type="submit">Create account</button>
      </form>
      <div class="divider">or</div>
      <button class="btn ghost" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="checklist">
        <div class="row"><b>01</b> You — coming up next</div>
        <div class="row"><b>02</b> Training</div>
        <div class="row"><b>03</b> Food</div>
        <div class="row"><b>04</b> Your plan</div>
      </div>
    </div>
  </div>

<script>
(function(){
  var GRID = [
    "________________","__XX________XX__","_XXXX______XXXX_","XXPXXX____XXXPXX",
    "XPPXXXXXXXXXXPPX","XPYXXXXXXXXXXYPX","XXXXXIWXXIWXXXXX","XXXXXIIXXIIXXXXX",
    "XXXXXXXXXXXXXXXX","XXXXXIIIIIIXXXXX","_XXXXXXXXXXXXXX_","__XXXXXXXXXXXX__",
    "____XXXXXXXX____","_____XXXXXX_____","______XXXX______","_______XX_______"
  ];
  var PALETTE = { X:"#bcb4cc", Y:"#9ea5b8", Z:"#b3a0ff", I:"#0d101b", W:"#ffffff", K:"#1a1d2c", P:"#f4b5d6" };
  document.querySelectorAll(".pixel-avatar").forEach(function(el){
    var svg = '<svg viewBox="0 0 128 128" width="100%" height="100%" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">';
    GRID.forEach(function(row, y){
      for (var x = 0; x < row.length; x++){
        var c = PALETTE[row[x]];
        if (!c) continue;
        svg += '<rect x="'+x*8+'" y="'+y*8+'" width="8" height="8" fill="'+c+'"/>';
      }
    });
    svg += '</svg>';
    el.innerHTML = svg;
  });
})();
</script>
</body>
</html>
